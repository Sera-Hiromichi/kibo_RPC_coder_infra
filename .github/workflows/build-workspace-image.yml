name: Validate workspace image

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check shell syntax
        run: |
          bash -n backup-workspace.sh
          bash -n workspace-image/fetch-official-sources.sh

      - name: Validate Compose configuration
        run: |
          docker compose \
            -f workspace-image/compose.yaml \
            --profile build config --quiet

      - name: Build workspace image
        run: |
          docker compose \
            -f workspace-image/compose.yaml \
            --profile build build

      - name: Verify ROS environment as workspace user
        run: |
          docker run --rm \
            --network none \
            --entrypoint bash \
            intball2-workspace:noetic-v1 \
            -c '
              set -eo pipefail
              test "$(id -un)" = coder
              source /opt/intball2_ws/devel/setup.bash
              rospack find ib2_msgs
              rospack find platform_msgs
              rospack find sample_tests
              python3 -c "import rospy, actionlib, numpy, rospkg; import ib2_msgs.msg, platform_msgs.msg, platform_msgs.srv"
           '
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Publish workspace image
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          IMAGE: ghcr.io/sera-hiromichi/kibo-rpc-workspace
        run: |
          ref="${IMAGE}:sha-${GITHUB_SHA}"

          docker tag intball2-workspace:noetic-v1 "$ref"
          docker push "$ref"

          digest=$(docker image inspect "$ref" \
            --format '{{index .RepoDigests 0}}')

          {
            echo '### Published workspace image'
            echo
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Image: \`${ref}\`"
            echo "- Digest reference: \`${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
